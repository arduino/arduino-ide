name: Sign Windows

# Builds and signs the Windows release on the self-hosted signing runner.
# build.yml calls it as `sign-windows.yml@main`, only for main and release tags.
# See: https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows
on:
  workflow_call:
    inputs:
      is-nightly:
        type: string
        required: true
      is-release:
        type: string
        required: true
    secrets:
      INSTALLER_CERT_WINDOWS_CER:
        required: true
      INSTALLER_CERT_WINDOWS_PASSWORD:
        required: true
      INSTALLER_CERT_WINDOWS_CONTAINER:
        required: true

permissions:
  contents: read

env:
  JOB_TRANSFER_ARTIFACT: build-artifacts-Windows_64bit
  # Location of artifacts generated by build.
  BUILD_ARTIFACTS_PATH: electron-app/dist/build-artifacts
  # Build from a short symlink to the workspace, otherwise paths are too long for `light.exe`.
  # Changing the workspace path breaks the checkout action: https://github.com/actions/checkout/issues/197
  WORKING_DIRECTORY: 'C:\a'
  PUPPETEER_SKIP_DOWNLOAD: true

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Allow only main and release tags
        run: |
          EVENT_REGEX="^(push|schedule|workflow_dispatch|workflow_run)$"
          TAG_REGEX="^refs/tags/[0-9]+\.[0-9]+\.[0-9]+"
          if [[
            "$GITHUB_REPOSITORY" != "arduino/arduino-ide" ||
            ! "$GITHUB_EVENT_NAME" =~ $EVENT_REGEX ||
            ! ( "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" =~ $TAG_REGEX )
          ]]; then
            echo "::error::Windows signing runs only for main and release tags of arduino/arduino-ide."
            exit 1
          fi

  build:
    needs: guard
    runs-on: [self-hosted, windows-sign-pc]
    defaults:
      run:
        shell: bash

    timeout-minutes: 90

    steps:
      - name: Symlink custom working directory
        shell: cmd
        run: |
          if not exist "${{ env.WORKING_DIRECTORY }}" mklink /d "${{ env.WORKING_DIRECTORY }}" "C:\actions-runner\_work\arduino-ide\arduino-ide"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build
        env:
          # Avoid failure of @vscode/ripgrep installation due to GitHub API rate limiting:
          # https://github.com/microsoft/vscode-ripgrep#github-api-limit-note
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          npx node-gyp@11 install
          yarn install

          yarn --cwd arduino-ide-extension build
          yarn --cwd electron-app rebuild
          yarn --cwd electron-app build

      # The signing secrets are only passed to this step.
      - name: Package
        env:
          IS_NIGHTLY: ${{ inputs.is-nightly }}
          IS_RELEASE: ${{ inputs.is-release }}
          CAN_SIGN: ${{ secrets.INSTALLER_CERT_WINDOWS_CER != '' }}
          INSTALLER_CERT_WINDOWS_CER: '/tmp/cert.cer'
          # signtool is not on the PATH by default. This path can change with a new runner version.
          SIGNTOOL_PATH: 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.19041.0/x86/signtool.exe'
          WIN_CERT_PASSWORD: ${{ secrets.INSTALLER_CERT_WINDOWS_PASSWORD }}
          WIN_CERT_CONTAINER_NAME: ${{ secrets.INSTALLER_CERT_WINDOWS_CONTAINER }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: yarn --cwd electron-app package

      - name: Upload builds to job transfer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.JOB_TRANSFER_ARTIFACT }}
          path: ${{ env.WORKING_DIRECTORY }}/${{ env.BUILD_ARTIFACTS_PATH }}

      - name: Manual clean up
        shell: cmd
        run: |
          rmdir /s /q "${{ env.WORKING_DIRECTORY }}\${{ env.BUILD_ARTIFACTS_PATH }}"
